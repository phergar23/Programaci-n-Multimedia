  --tinta:var(--ink); --apagado:var(--muted); --enlace:var(--accent); --ok:var(--good); --mal:var(--bad); --visitado:var(--hot); --regla:var(--line);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D0B14; --surface:#15121F; --surface-2:#1A1727; --surface-3:#211D31;
    --ink:#EDEAF7; --ink-2:#C6C1DA; --muted:#8F89A8; --line:#2C283F; --line-2:#221F32;
    --accent:#A590FF; --accent-hover:#B8A7FF; --accent-ink:#150C36; --accent-soft:#261F47; --accent-line:#4A3E86;
    --hot:#FF6AA2; --hot-soft:#3A1628;
    --warn:#F2B452; --warn-soft:#352812;
    --good:#52CF8F; --good-soft:#12301F; --bad:#FF7B74; --bad-soft:#3A1A1A;
    --info:#6CB6FF; --info-soft:#12263A;
    --code-bg:#0F0D18; --code-bar:#17142A; --code-line:#262238;
    --stage:#0B0913; --stage-2:#141120; --stage-line:#262139;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px -12px rgba(0,0,0,.7);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0D0B14; --surface:#15121F; --surface-2:#1A1727; --surface-3:#211D31;
    --ink:#EDEAF7; --ink-2:#C6C1DA; --muted:#8F89A8; --line:#2C283F; --line-2:#221F32;
    --accent:#A590FF; --accent-hover:#B8A7FF; --accent-ink:#150C36; --accent-soft:#261F47; --accent-line:#4A3E86;
    --hot:#FF6AA2; --hot-soft:#3A1628;
    --warn:#F2B452; --warn-soft:#352812;
    --good:#52CF8F; --good-soft:#12301F; --bad:#FF7B74; --bad-soft:#3A1A1A;
    --info:#6CB6FF; --info-soft:#12263A;
    --code-bg:#0F0D18; --code-bar:#17142A; --code-line:#262238;
    --stage:#0B0913; --stage-2:#141120; --stage-line:#262139;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px -12px rgba(0,0,0,.7);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-padding-top:24px}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;font-feature-settings:"calt" 0;font-variant-ligatures:no-contextual}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ================= Estructura ================= */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;overflow:hidden;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:18px 18px 14px;display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.brand-mark{width:42px;height:42px;flex:none}
.brand-t{font-family:var(--f-display);font-weight:600;font-size:15.5px;line-height:1.15;letter-spacing:-.01em}
.brand-s{font-size:12.5px;color:var(--muted);letter-spacing:.02em;margin-top:2px}
.ver{display:inline-flex;align-items:center;gap:6px;width:fit-content;padding:3px 10px;border-radius:999px;background:var(--hot-soft);color:var(--hot);font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:0;white-space:nowrap}
.brand .ver{margin-top:6px;font-size:11px;padding:2px 8px}
.ver b{font-weight:700}
.side-search{padding:0 14px 10px;position:relative}
.side-search input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 34px 8px 34px;font-size:14.5px;outline:none}
.side-search input:focus{border-color:var(--accent);background:var(--surface)}
.side-search .ico{position:absolute;left:25px;top:10px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.side-search kbd{position:absolute;right:22px;top:8px;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);background:var(--surface)}
.side-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0 14px 6px;padding:3px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px}
.side-tabs button{appearance:none;border:0;background:transparent;border-radius:8px;padding:5px 8px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
.side-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.side-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 10px 16px}
.quick{display:flex;flex-direction:column;gap:1px;padding:2px 0 8px;border-bottom:1px solid var(--line-2);margin-bottom:8px}
.qlink{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;text-decoration:none;color:var(--ink-2);font-size:15px}
.qlink svg{width:18px;height:18px;flex:none;color:var(--muted)}
.qlink:hover{background:var(--surface-2);color:var(--ink)}
.qlink[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.qlink[aria-current="page"] svg{color:var(--accent)}
.qlink .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.ngrp{margin-bottom:2px}
.ngrp-h{appearance:none;border:0;background:none;width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;text-align:left;padding:7px 10px;border-radius:9px;cursor:pointer;color:var(--ink-2)}
.ngrp-h:hover{background:var(--surface-2)}
.ngrp-h .bn{font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--accent);border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:7px;text-align:center;padding:1px 0}
.ngrp-h .bt{font-size:14px;font-weight:700;line-height:1.25}
.ngrp-h .bp{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ngrp-h .chev{width:12px;height:12px;transition:transform .2s;color:var(--muted)}
.ngrp.open .ngrp-h .chev{transform:rotate(90deg)}
.ngrp-l{display:none;list-style:none;margin:0 0 6px;padding:0 0 0 18px}
.ngrp.open .ngrp-l{display:block}
.ngrp-l a{display:grid;grid-template-columns:34px 1fr 12px;gap:8px;align-items:baseline;padding:5px 8px 5px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:14px;line-height:1.3;border-left:2px solid var(--line-2);border-radius:0 8px 8px 0}
.ngrp-l a:hover{background:var(--surface-2);color:var(--ink)}
.ngrp-l a .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.ngrp-l a .d{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);align-self:center}
.ngrp-l a .d.ok{background:var(--good);border-color:var(--good)}
.ngrp-l a .d.half{background:linear-gradient(90deg,var(--good) 50%,transparent 50%);border-color:var(--good)}
.ngrp-l a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:700;border-left-color:var(--accent)}
.ngrp-l a[aria-current="page"] .n{color:var(--accent)}
.ngrp-l .sub{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px 3px 12px}
.ngrp-l a.fic{grid-template-columns:1fr;padding-left:12px}
.srch{display:flex;flex-direction:column;gap:2px}
.srch .h{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 10px 4px}
.srch a{display:block;padding:7px 10px;border-radius:9px;text-decoration:none;color:var(--ink-2);font-size:14px;line-height:1.35}
.srch a:hover,.srch a.kb{background:var(--surface-2);color:var(--ink)}
.srch a b{display:block;color:var(--ink);font-size:14.5px}
.srch a small{display:block;color:var(--muted);font-size:12.5px}
.srch mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}
.srch .none{padding:10px;color:var(--muted);font-size:14px}
.side-foot{padding:12px 16px 14px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.side-foot .row{justify-content:space-between}
.pbar{height:6px;background:var(--line-2);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good);width:0;transition:width .5s ease}
.theme-btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:12.5px;cursor:pointer;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.theme-btn svg{width:14px;height:14px}

.topbar{display:none}
.main{min-width:0;padding-inline:clamp(16px,3.6vw,52px);padding-block:30px 90px;position:relative}
.readbar{position:fixed;top:env(safe-area-inset-top,0px);left:var(--side);right:0;height:3px;z-index:15;pointer-events:none}
.readbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--hot))}
.wrap{max-width:1120px;margin:0 auto}
.view{animation:vin .28s ease}
@keyframes vin{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(330px,88vw);z-index:40;transform:translateX(-104%);transition:transform .25s ease;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(8,6,16,.5);z-index:30}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;gap:10px;padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar .t{font-family:var(--f-display);font-size:13.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .readbar{left:0}
  .main{padding-block:20px 70px}
}

/* ================= Tipografía ================= */
h1,h2,h3,h4{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(27px,3.8vw,42px);line-height:1.1;letter-spacing:-.02em}
h2{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,2.2vw,24px);line-height:1.25;letter-spacing:-.01em}
h3{font-size:18.5px;line-height:1.3;font-weight:700}
.eyebrow{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.eyebrow .sep{color:var(--line)}
.eyebrow .m{color:var(--muted)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:16px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--accent);text-decoration:underline}
.crumbs .s{opacity:.5}
.lead{font-size:clamp(17px,1.6vw,19px);color:var(--ink-2);max-width:66ch;margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}

/* ================= Prosa (contenido del curso) ================= */
.prose{max-width:72ch;color:var(--ink-2)}
.prose>*{margin:0}
.prose>*+*{margin-top:14px}
.prose h2{color:var(--ink);margin-top:44px;padding-top:6px;scroll-margin-top:22px;display:flex;gap:12px;align-items:baseline}
.prose h2 .hn{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--accent);letter-spacing:0;flex:none;transform:translateY(-2px)}
.prose h3{color:var(--ink);margin-top:28px}
.prose>h2:first-child{margin-top:8px}
.prose strong{color:var(--ink)}
.prose ul,.prose ol{padding-left:24px}
.prose li+li{margin-top:6px}
.prose li::marker{color:var(--accent)}
.prose ol>li::marker{font-family:var(--f-mono);font-size:.88em;font-weight:600}
.prose blockquote{margin-inline:0;padding:12px 16px;border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:0 var(--r-sm) var(--r-sm) 0;color:var(--ink)}
.prose blockquote>*{margin:0}
.prose blockquote>*+*{margin-top:8px}
.prose hr{border:0;border-top:1px solid var(--line);margin:28px 0}
code{font-family:var(--f-mono);font-size:.86em;background:var(--accent-soft);color:var(--ink);padding:.08em .38em;border-radius:5px;overflow-wrap:anywhere;font-variant-ligatures:none}
.prose .wide{max-width:none}

/* Bloques de código estilo editor */
.code{margin:0;border-radius:var(--r-sm);overflow:hidden;background:var(--code-bg);border:1px solid var(--code-line);box-shadow:var(--shadow-sm);max-width:100%}
.code-h{display:flex;align-items:center;gap:10px;padding:0 6px 0 0;background:var(--code-bar);border-bottom:1px solid var(--code-line);min-height:36px}
.code-tab{display:flex;align-items:center;gap:8px;padding:8px 13px;font-family:var(--f-mono);font-size:12.5px;color:var(--code-ink);border-right:1px solid var(--code-line);background:var(--code-bg);align-self:stretch;min-width:0;border-top:2px solid var(--code-muted)}
.code-tab .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code-tab svg{width:14px;height:14px;flex:none}
.code[data-state="bien"] .code-tab{border-top-color:#52CF8F}
.code[data-state="bien"] .code-tab svg{color:#52CF8F}
.code[data-state="mal"] .code-tab{border-top-color:#FF6B6B}
.code[data-state="mal"] .code-tab svg{color:#FF6B6B}
.code[data-state="mal"]{border-color:rgba(255,107,107,.45)}
.code[data-state="bien"]{border-color:rgba(82,207,143,.35)}
.code-lang{margin-left:auto;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--code-muted)}
.code-copy{appearance:none;border:1px solid var(--code-line);background:transparent;color:var(--code-muted);border-radius:7px;padding:3px 8px;font-size:12px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.code-copy:hover{color:var(--code-ink);border-color:var(--code-muted)}
.code-copy svg{width:13px;height:13px}
.code pre{margin:0;padding:13px 16px;overflow-x:auto;font-family:var(--f-mono);font-size:13.5px;line-height:1.6;color:var(--code-ink);tab-size:2;font-variant-ligatures:none}
.code pre code{background:none;padding:0;color:inherit;font-size:inherit;border-radius:0;overflow-wrap:normal;white-space:pre}
.code-verdict{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.code[data-state="bien"] .code-verdict{background:rgba(82,207,143,.14);color:#6FE0A6}
.code[data-state="mal"] .code-verdict{background:rgba(255,107,107,.14);color:#FF8A84}
/* tokens */
.tk-k{color:#FF7AB6}.tk-l{color:#FF9E64}.tk-s{color:#A6E08F}.tk-n{color:#F9C56E}.tk-c{color:#7F7A99;font-style:italic}
.tk-d{color:#FF9E64}.tk-t{color:#7FCBFF}.tk-f{color:#BCA9FF}.tk-p{color:#E7E3F4}.tk-o{color:#C3BED8}
.tk-tag{color:#FF7AB6}.tk-at{color:#F9C56E}.tk-ng{color:#6FE0D0}.tk-cf{color:#FF9E64;font-weight:600}.tk-i{color:#BCA9FF}.tk-tx{color:#E7E3F4}
.tk-dim{color:#6E6989}.tk-dir{color:#7FCBFF}.tk-sel{color:#BCA9FF}.tk-err{color:#FF8A84}
.ln-hl{background:rgba(165,144,255,.16);box-shadow:inset 3px 0 0 #A590FF;display:inline-block;width:100%}

/* Diagramas SVG */
.diagrama{margin:0;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow-x:auto}
.diagrama svg{display:block;margin:0 auto;max-width:100%;height:auto;min-width:520px}
.diagrama figcaption{margin-top:10px;font-size:13.5px;color:var(--muted);text-align:center}

/* Tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th,table.t td{padding:9px 13px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-2)}
table.t tr:last-child td{border-bottom:0}
table.t th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:700}
table.t td code{white-space:nowrap}

/* Cajas (:::) */
.callout{border-radius:var(--r-sm);padding:14px 16px 14px 48px;position:relative;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink)}
.callout>.ci{position:absolute;left:15px;top:15px;width:20px;height:20px}
.callout .ct{font-weight:700;margin:0 0 4px;font-size:15.5px;line-height:1.35}
.callout>*:not(.ci){margin:0}
.callout>*:not(.ci)+*{margin-top:9px}
.callout p{color:var(--ink-2)}
.callout.aviso{background:var(--warn-soft);border-color:transparent}.callout.aviso .ci,.callout.aviso .ct{color:var(--warn)}
.callout.error{background:var(--bad-soft);border-color:transparent}.callout.error .ci,.callout.error .ct{color:var(--bad)}
.callout.clave{background:var(--accent-soft);border-color:transparent}.callout.clave .ci,.callout.clave .ct{color:var(--accent)}
.callout.analogia{background:var(--hot-soft);border-color:transparent}.callout.analogia .ci,.callout.analogia .ct{color:var(--hot)}
.callout.pro{background:var(--good-soft);border-color:transparent}.callout.pro .ci,.callout.pro .ct{color:var(--good)}
.callout.nota{background:var(--info-soft);border-color:transparent}.callout.nota .ci,.callout.nota .ct{color:var(--info)}
.callout .code{margin-top:10px}

/* Enlaces a fichas */
.ref{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-line);font-weight:700;cursor:pointer}
.ref:hover{border-bottom-color:var(--accent);background:var(--accent-soft)}
.ref::before{content:"§";font-family:var(--f-mono);font-weight:400;font-size:.85em;margin-right:2px;opacity:.75}
.ref-rota{color:var(--bad);border-bottom:1px dotted var(--bad);cursor:help}
.pop{position:fixed;z-index:60;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:14px;color:var(--ink-2);pointer-events:none;animation:vin .15s ease}
.pop b{display:block;color:var(--ink);font-size:15px;margin:2px 0 4px;line-height:1.3}
.pop .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}

/* ================= Componentes ================= */
.btn{appearance:none;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;padding:8px 15px;border-radius:10px;cursor:pointer;line-height:1.25;display:inline-flex;align-items:center;gap:7px;transition:background .15s,transform .05s,border-color .15s;text-decoration:none}
.btn:hover{background:var(--accent-hover)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--accent-line)}
.btn.hot{background:var(--hot);color:#fff}
.btn.good{background:var(--good);color:#fff}
.btn.sm{padding:5px 11px;font-size:14px;border-radius:9px}
.btn svg{width:16px;height:16px;flex:none}
.btn[aria-pressed="true"]{background:var(--good);color:#fff;border-color:var(--good)}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:14px;padding:5px 12px;border-radius:999px;cursor:pointer;line-height:1.25;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:700}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);line-height:1.3;white-space:nowrap}
.tag svg{width:13px;height:13px}
.tag.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.hot{background:var(--hot-soft);color:var(--hot);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.tag.mono{font-family:var(--f-mono);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.panel{background:var(--surface-2);border-radius:12px;padding:14px 16px}

/* ================= Inicio ================= */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px;align-items:center;margin-bottom:34px}
.hero .copy{display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(34px,5vw,58px)}
.hero h1 em{font-style:normal;color:var(--hot)}
.hero-stage{background:var(--stage);border-radius:var(--r);border:1px solid var(--stage-line);overflow:hidden;box-shadow:var(--shadow);position:relative}
.hero-stage canvas{display:block;width:100%;touch-action:none;cursor:pointer}
.hero-cap{position:absolute;z-index:1;left:14px;bottom:10px;right:14px;display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--stage-muted);pointer-events:none}
.hero-cap i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
@media (max-width:1100px){.hero{grid-template-columns:1fr}}
.intro-full{max-width:78ch;color:var(--ink-2);font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:20px 0 34px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.stat b{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1;letter-spacing:-.02em}
.stat .v small{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:400}
.resume{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(120deg,var(--accent-soft),var(--hot-soft));border-radius:var(--r);padding:16px 20px;margin-bottom:12px;border:1px solid var(--accent-line)}
.resume .k{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
.resume .tt{font-weight:700;font-size:17px}
.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:860px){.blocks{grid-template-columns:1fr}}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.bcard-h{padding:16px 18px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start}
.bnum{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:21px;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line)}
.bcard-h h3{font-size:17px}
.bcard-h p{margin:4px 0 0;font-size:14.5px;color:var(--muted);line-height:1.45}
.ring{width:44px;height:44px;flex:none}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--line-2)}
.ring .fg{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring text{font-family:var(--f-mono);font-size:11px;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.slist{list-style:none;margin:0;padding:0 8px 10px}
.slist a{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:baseline;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink)}
.slist a:hover{background:var(--surface-2)}
.slist .n{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.slist .tt{font-size:15px;line-height:1.3}
.slist .tt small{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:2px}
.slist .st{display:flex;gap:5px;align-items:center}
.slist .d{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line)}
.slist .d.ok{background:var(--good);border-color:var(--good)}
.slist .ic{width:15px;height:15px;color:var(--muted)}
.slist .ic.hot{color:var(--hot)}
.slist .ic.acc{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--muted);margin:10px 0 16px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend svg{width:15px;height:15px}

/* ================= Sesión / ficha ================= */
.shead{display:flex;flex-direction:column;gap:12px;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:8px}
.objective{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:80ch}
.objective svg{width:22px;height:22px;color:var(--hot);margin-top:2px}
.objective b{display:block;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--hot)}
.objective p{margin:0;color:var(--ink);font-size:16.5px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.concepts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.concepts .c{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px;color:var(--ink-2)}
.refs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.refs a.chip{font-size:13.5px}
.refs a.chip::before{content:"§";font-family:var(--f-mono);color:var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 236px;gap:44px;align-items:start}
.toc{position:sticky;top:26px;max-height:calc(100vh - 52px);overflow:auto;padding:4px 0 10px;font-size:14px}
.toc h4{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.toc ol{list-style:none;margin:0 0 18px;padding:0;border-left:2px solid var(--line-2)}
.toc a{display:block;padding:5px 10px;margin-left:-2px;border-left:2px solid transparent;color:var(--muted);text-decoration:none;line-height:1.35}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--ink);border-left-color:var(--accent);font-weight:700}
.toc a.lab{color:var(--hot)}
.toc a.lab::before{content:"▸ ";}
.toc .kb{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line-2);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.toc kbd,.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--surface)}
@media (max-width:1240px){.layout{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.sec-h{display:flex;align-items:center;gap:12px;margin:52px 0 16px;scroll-margin-top:22px}
.sec-h h2{flex:none}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-h .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.sec-h .ic svg{width:19px;height:19px}
.sec-h.hot .ic{background:var(--hot-soft);color:var(--hot)}
.sec-h.good .ic{background:var(--good-soft);color:var(--good)}
.sec-note{color:var(--muted);font-size:15px;max-width:72ch;margin:-6px 0 16px}

/* Ejercicios */
.ej{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.ej-h{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.lane{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.lane i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-size:13px;color:#fff}
.lane[data-c="A"]{color:var(--good)}.lane[data-c="A"] i{background:var(--good)}
.lane[data-c="B"]{color:var(--accent)}.lane[data-c="B"] i{background:var(--accent);color:var(--accent-ink)}
.lane[data-c="C"]{color:var(--warn)}.lane[data-c="C"] i{background:var(--warn)}
.lane[data-c="D"]{color:var(--hot)}.lane[data-c="D"] i{background:var(--hot)}
.ej[data-c="D"]{border-color:var(--hot);border-width:1.5px}
.ej-h h3{flex:1 1 260px;font-size:17.5px}
.ej-b{padding:16px 18px}
.ej-b.prose{max-width:none}
.ej-a{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--line-2)}
.ej-x{border-top:1px solid var(--line-2);padding:14px 18px;background:var(--surface-2)}
.ej-x .xl{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.ej-x.pista .xl{color:var(--warn)}
.ej-x.sol .xl{color:var(--good)}
.ej-x.gate{background:var(--warn-soft)}
.ej-x.gate .xl{color:var(--warn)}
.ej-x .prose{max-width:none}
.ej-x .prose>*+*{margin-top:10px}

/* Preguntas */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.q .qt{font-weight:700;font-size:17px;color:var(--ink);display:flex;gap:10px}
.q .qt .qn{font-family:var(--f-mono);color:var(--accent);font-weight:600;font-size:14px;flex:none;padding-top:2px}
.opts{display:grid;gap:8px}
.opt{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--surface-2);border-radius:11px;padding:10px 14px;cursor:pointer;font-size:15.5px;line-height:1.4;color:var(--ink);display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start}
.opt .l{font-family:var(--f-mono);font-size:12.5px;font-weight:600;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.ok .l{background:var(--good);color:#fff;border-color:var(--good)}
.opt.ko{background:var(--bad-soft);border-color:var(--bad)}
.opt.ko .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt .r{font-size:12.5px;font-weight:700;align-self:center}
.opt.ok .r{color:var(--good)}.opt.ko .r{color:var(--bad)}
.why{font-size:15px;color:var(--ink-2);padding:11px 14px;border-radius:10px;background:var(--surface-2);border-left:3px solid var(--accent);animation:vin .3s ease}
.why>*{margin:0}.why>*+*{margin-top:8px}

/* Paginador */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:52px;padding-top:24px;border-top:1px solid var(--line)}
.pager a{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0;transition:border-color .15s,transform .15s}
.pager a:hover{border-color:var(--accent);transform:translateY(-1px)}
.pager a small{color:var(--muted);font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700}
.pager a span{font-weight:700;line-height:1.3}
.pager a span .n{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);margin-right:6px;font-weight:600}
.pager a.nx{grid-column:2;text-align:right}
@media (max-width:600px){.pager{grid-template-columns:1fr}.pager a.nx{grid-column:1}}

/* Referencia */
.ref-search{display:flex;gap:10px;align-items:center;margin:18px 0 8px;max-width:560px}
.ref-search input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 14px;font-size:16px;outline:none}
.ref-search input:focus{border-color:var(--accent)}
.rblock{margin-top:32px}
.rblock>h2{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.rtema{margin:14px 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ritem{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.ritem:hover{border-color:var(--accent);transform:translateY(-1px)}
.ritem b{font-size:15px;line-height:1.35}
.ritem span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.ritem .labmark{color:var(--hot)}

/* Laboratorio (índice) */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.lcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s,box-shadow .15s}
.lcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.lcard .th{height:118px;background:var(--stage);border-bottom:1px solid var(--stage-line);display:grid;place-items:center;position:relative;overflow:hidden}
.lcard .th svg{width:100%;height:100%}
.lcard .bd{padding:13px 16px 15px;display:flex;flex-direction:column;gap:6px}
.lcard .bd b{font-size:16px;line-height:1.3}
.lcard .bd p{margin:0;font-size:14px;color:var(--muted);line-height:1.45}
.lcard .bd .row{gap:6px}

/* Verificador y progreso */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field input[type=text],.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:15px;outline:none;max-width:100%}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--accent)}
.field textarea{font-family:var(--f-mono);font-size:13px;line-height:1.5;min-height:170px;resize:vertical;white-space:pre;overflow-wrap:normal;overflow-x:auto;font-variant-ligatures:none}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);margin-bottom:14px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop svg{width:26px;height:26px;display:block;margin:0 auto 6px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.result{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:18px;background:var(--surface)}
.result-h{padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:700}
.chk{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line-2);font-size:15px}
.chk:last-child{border-bottom:0}
.chk .m{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.chk.si .m{background:var(--good)}.chk.no .m{background:var(--bad)}.chk.duda .m{background:var(--warn)}
.chk small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:12.5px;margin-top:2px;word-break:break-word}
#lienzo{position:absolute;left:-10000px;top:0;width:390px;overflow:hidden}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:18px 0 8px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.meter b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meter .v{font-family:var(--f-mono);font-size:27px;font-weight:600;line-height:1;letter-spacing:-.02em}
.meter .v small{font-family:var(--f-body);font-size:14px;font-weight:400;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.heat a{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:7px 8px;border-radius:9px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);font-family:var(--f-mono);font-size:12.5px}
.heat a .bb{display:flex;gap:3px}
.heat a .bb i{width:8px;height:8px;border-radius:2px;background:var(--line-2)}
.heat a .bb i.e{background:var(--good)}.heat a .bb i.q{background:var(--accent)}.heat a .bb i.x{background:var(--bad)}
.heat a:hover{border-color:var(--accent)}
.heat a.full{border-color:var(--good);background:var(--good-soft)}
.hblk{margin:16px 0 6px;font-size:13px;font-weight:700;color:var(--muted)}
.confirm{margin-top:12px;background:var(--warn-soft);border-radius:12px;padding:14px 16px}
.stamp{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

/* Avisos flotantes */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(380px,92vw)}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;font-size:14.5px;border-radius:10px;box-shadow:var(--shadow);animation:vin .25s ease}
.toast.bad{background:var(--bad);color:#fff}

/* ================= Laboratorios ================= */
.sim{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin:26px 0;max-width:none}
.prose>.sim{margin-top:26px}
.sim-h{display:flex;justify-content:space-between;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:14px 18px 12px;border-bottom:1px solid var(--line-2)}
.sim-h h3{font-size:17.5px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.sim-h .labtag{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--hot);border:1px solid currentColor;border-radius:6px;padding:1px 7px;flex:none}
.sim-h .hint{font-size:14px;color:var(--muted)}
.sim-h .open{font-size:13px;color:var(--muted);text-decoration:none}
.sim-h .open:hover{color:var(--accent)}
.stage{position:relative;background:var(--stage);color:var(--stage-ink)}
.stage-cv{display:block;width:100%;touch-action:none}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:13px 18px}
.ctrl+.ctrl{padding-top:0}
.ctrl .grp{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.ctrl .lab{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:2px}
.readout{display:flex;flex-wrap:wrap;gap:8px 24px;padding:12px 18px;background:var(--surface-2);border-top:1px solid var(--line-2);font-size:15px}
.readout .it{display:flex;flex-direction:column}
.readout .it>b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.readout .it>span{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15.5px;color:var(--ink)}
.msg{padding:12px 18px;border-top:1px solid var(--line-2);font-size:15px;line-height:1.5;color:var(--ink)}
.msg.good{background:var(--good-soft)}.msg.bad{background:var(--bad-soft)}.msg.info{background:var(--accent-soft)}.msg.warn{background:var(--warn-soft)}
.msg code{background:rgba(127,127,160,.16)}
.rng{display:flex;align-items:center;gap:10px;font-size:14.5px;flex-wrap:wrap}
.rng input[type=range]{width:min(200px,48vw);accent-color:var(--accent)}
.rng output{font-family:var(--f-mono);min-width:4ch;color:var(--ink)}
.sw{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:14.5px;user-select:none}
.sw input{appearance:none;width:36px;height:21px;border-radius:21px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.sw input::after{content:"";position:absolute;left:3px;top:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(15px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);flex-wrap:wrap}
.seg button{appearance:none;border:0;background:transparent;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--line-2);overflow-x:auto;background:var(--surface)}
.tabs button{appearance:none;border:0;background:transparent;padding:8px 13px;font-size:14.5px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hot)}
/* piezas reutilizables dentro de laboratorios */
.lab-cols{display:grid;gap:14px;padding:16px 18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.lab-cols.c3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.pane{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;min-width:0;display:flex;flex-direction:column}
.pane-h{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line-2);background:var(--surface-2);display:flex;gap:8px;align-items:center;justify-content:space-between}
.pane-h .fn{font-family:var(--f-mono);text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink-2)}
.pane-b{padding:12px;min-width:0}
.pane.dark{background:var(--code-bg);border-color:var(--code-line)}
.pane.dark .pane-h{background:var(--code-bar);border-color:var(--code-line);color:var(--code-muted)}
.pane.dark .pane-h .fn{color:var(--code-ink)}
.pane.dark .btn.ghost{color:var(--code-ink);border-color:var(--code-line)}
.pane.dark .btn.ghost:hover{background:rgba(255,255,255,.06);border-color:var(--code-muted)}
.sim>.term{margin:0 18px 16px;border-radius:10px}
.cl{margin:0;padding:10px 0;font-family:var(--f-mono);font-size:12.8px;line-height:1.65;color:var(--code-ink);overflow-x:auto;font-variant-ligatures:none}
.cl>div{padding:0 12px 0 calc(12px + 3ch);text-indent:-3ch;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.65em;transition:background .25s,box-shadow .25s,opacity .25s;position:relative}
.cl>div.hl{background:rgba(165,144,255,.18);box-shadow:inset 3px 0 0 #A590FF}
.cl>div.hl-g{background:rgba(82,207,143,.16);box-shadow:inset 3px 0 0 #52CF8F}
.cl>div.hl-r{background:rgba(255,107,107,.16);box-shadow:inset 3px 0 0 #FF6B6B}
.cl>div.hl-y{background:rgba(249,197,110,.16);box-shadow:inset 3px 0 0 #F9C56E}
.cl>div.hl-p{background:rgba(255,106,162,.16);box-shadow:inset 3px 0 0 #FF6AA2}
.cl>div.dimmed{opacity:.35}
.cl .squig{text-decoration:underline wavy #FF6B6B;text-underline-offset:3px;text-decoration-skip-ink:none}
.cl .ghost{opacity:.4}
.term{font-family:var(--f-mono);font-size:12.8px;line-height:1.55;background:var(--code-bg);color:var(--code-ink);padding:10px 12px;min-height:120px;max-height:230px;overflow:auto;border-radius:0}
.term>div{white-space:pre-wrap;word-break:break-word;animation:vin .25s ease}
.term .t-dim{color:var(--code-muted)}.term .t-ok{color:#6FE0A6}.term .t-err{color:#FF8A84}.term .t-warn{color:#F9C56E}.term .t-acc{color:#BCA9FF}.term .t-hot{color:#FF8FBA}.term .t-info{color:#7FCBFF}
.diag{font-family:var(--f-mono);font-size:13px;line-height:1.5;padding:10px 12px;border-radius:10px}
.diag.ok{background:var(--good-soft);color:var(--good)}
.diag.err{background:var(--bad-soft);color:var(--bad)}
.diag .code-n{font-weight:700;margin-right:6px}
.pane.dark .diag.err{background:rgba(255,107,107,.13);color:#FF9E98}
.pane.dark .diag.ok{background:rgba(82,207,143,.13);color:#7BE3AE}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(255,106,162,.0)}25%{box-shadow:0 0 0 4px rgba(255,106,162,.55)}100%{box-shadow:0 0 0 0 rgba(255,106,162,0)}}
.pulse-acc{animation:pacc .9s ease}
@keyframes pacc{0%{box-shadow:0 0 0 0 rgba(120,90,255,0)}30%{box-shadow:0 0 0 5px rgba(120,90,255,.45)}100%{box-shadow:0 0 0 0 rgba(120,90,255,0)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-family:var(--f-mono);font-size:13.5px;align-items:baseline}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--ink);word-break:break-word}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.on{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.off{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.hot{background:var(--hot-soft);color:var(--hot);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.mini-browser{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;min-width:0}
.mb-bar{display:flex;gap:8px;align-items:center;padding:7px 9px;background:var(--surface-3);border-bottom:1px solid var(--line)}
.mb-bar .dots{display:flex;gap:4px}
.mb-bar .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.mb-url{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);overflow:hidden;white-space:nowrap}
.mb-url input{border:0;background:transparent;outline:none;flex:1;min-width:0;font:inherit;color:var(--ink)}
.mb-body{position:relative;min-height:190px;padding:12px;transition:opacity .15s}
.mb-body.blank{opacity:0}
.mb-load{position:absolute;left:0;top:0;height:3px;background:var(--accent);width:0}
.demo-ui{font-family:var(--f-body);color:var(--ink)}
.demo-ui h4{font-size:16px;margin:0 0 4px}
.demo-ui button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:14px}
.demo-ui button:disabled{opacity:.45;cursor:not-allowed}
.demo-ui input{border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--surface);font-size:14.5px;max-width:100%}
.demo-ui .agotado{color:var(--muted);text-decoration:line-through}
.el-tag{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.dom-node{border:1px dashed var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;position:relative}
.dom-node>.el-tag{position:absolute;top:-9px;left:8px;background:var(--surface);padding:0 4px}
.lab-foot{padding:10px 18px;border-top:1px solid var(--line-2);font-size:13.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lab-foot a{color:var(--muted)}
.lab-foot a:hover{color:var(--accent)}
@media (max-width:600px){
  .sim-h,.ctrl,.readout,.msg,.lab-cols{padding-left:14px;padding-right:14px}
  body{font-size:16.5px}
}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; el.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid); }
  return el;
}

/* Código línea a línea: [lang, texto] ; permite resaltar líneas */
function codeLines(host, lines) {
  const pre = h('div', { class: 'cl' });
  const render = ls => {
    pre.innerHTML = ls.map((l, i) => {
      if (l == null) return '<div></div>';
      const [lang, txt, extra] = Array.isArray(l) ? l : ['ts', l];
      return `<div data-i="${i}"${extra ? ` data-k="${extra}"` : ''}>${lang === 'raw' ? txt : HL.hl(txt, lang)}</div>`;
    }).join('');
  };
  render(lines); host.appendChild(pre);
  const api = {
    el: pre,
    set(ls) { render(ls); },
    hl(sel, cls = 'hl', ms) {
      const rows = typeof sel === 'number' ? [pre.children[sel]] : $$(`[data-k="${sel}"]`, pre);
      rows.forEach(r => { if (!r) return; r.classList.remove('hl', 'hl-g', 'hl-r', 'hl-y', 'hl-p'); void r.offsetWidth; r.classList.add(cls); });
      if (ms) setTimeout(() => rows.forEach(r => r && r.classList.remove(cls)), ms);
    },
    clear() { $$('div', pre).forEach(r => r.classList.remove('hl', 'hl-g', 'hl-r', 'hl-y', 'hl-p', 'dimmed')); }
  };
  return api;
}
/* Consola tipo terminal */
function terminal(host, { max = 60, placeholder = '' } = {}) {
  const t = h('div', { class: 'term', role: 'log', 'aria-live': 'polite' });
  if (placeholder) t.innerHTML = `<div class="t-dim">${placeholder}</div>`;
  host.appendChild(t);
  let fresh = !!placeholder;
  return {
    el: t,
    log(txt, cls = '') {
      if (fresh) { t.innerHTML = ''; fresh = false; }
      const d = h('div', { class: cls ? 't-' + cls : '', html: txt }); t.appendChild(d);
      while (t.children.length > max) t.firstChild.remove();
      t.scrollTop = t.scrollHeight;
      return d;
    },
    clear(ph) { t.innerHTML = ph ? `<div class="t-dim">${ph}</div>` : ''; fresh = !!ph; }
  };
}

const COL = { bg: '#110E1B', panel: '#1A1628', line: '#2A2540', line2: '#3A3456', ink: '#E4E0F2', muted: '#8C86A6', dim: '#5E587A', acc: '#A590FF', hot: '#FF6AA2', good: '#52CF8F', bad: '#FF6B6B', warn: '#F9C56E', info: '#6CB6FF', teal: '#6FE0D0' };

  const ctx = cv.getContext('2d');
  const S = { cv, ctx, wrap, w: 0, h: 0, t: 0, visible: true, ptr: { x: -1, y: -1, down: false, over: false } };
  function resize() {

    if (w === S.w && hh === S.h) return;

    if (S.visible && !document.hidden) { S.t += dt; try { draw(ctx, S.w, S.h, dt, S); } catch (err) { console.error(err); } }

  cv.addEventListener('pointermove', ev => { const p = pos(ev); S.ptr.x = p.x; S.ptr.y = p.y; S.ptr.over = true; S.onMove && S.onMove(p.x, p.y, ev); });
  cv.addEventListener('pointerleave', () => { S.ptr.over = false; S.ptr.x = -1; S.ptr.y = -1; });

  window.addEventListener('pointerup', up);
  onCleanup(() => { cancelAnimationFrame(raf); ro.disconnect(); io.disconnect(); window.removeEventListener('pointerup', up); });

}
function rrect(ctx, x, y, w, hh, r) { r = Math.min(r, w / 2, hh / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + hh, r); ctx.arcTo(x + w, y + hh, x, y + hh, r); ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function ctext(ctx, s, x, y, { size = 12, col = COL.ink, align = 'left', base = 'middle', weight = 400, mono = false } = {}) {
  ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = base;

  if (mono) { try { ctx.textRendering = 'optimizeSpeed'; } catch (e) { } s = String(s).replace(/([=!<>&|*+:.-])(?=[=!<>&|*+:.-])/g, '$1\u200C'); }

function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function glowDot(ctx, x, y, r, col) {

/* ---------- Comprobador de tipos ---------- */
lab('tipos', {
  title: 'Comprobador de tipos', block: '0', glyph: 'string | number', col: '#7FCBFF',
  desc: 'Declara un tipo, asígnale un valor y mira qué dice el compilador. En la segunda pestaña, pasa por encima de cada variable para ver qué tipo infiere TypeScript.',
  where: [{ s: '0.2', after: 'Tipos especiales: `null`, `undefined` y `void`' }], fichas: ['tipos-basicos'],
  mount(host) {
    const card = simCard(host, { id: 'tipos', title: 'Comprobador de tipos', hint: 'Lo que haría el compilador de TypeScript' });
    const TIPOS = ['string', 'number', 'boolean', 'string | number', 'number | null', 'string[]', '[number, number]', 'any'];
    const VALS = [
      { src: "'Ana'", t: 'string', el: null }, { src: '22', t: 'number' }, { src: 'true', t: 'boolean' }, { src: 'null', t: 'null' }, { src: 'undefined', t: 'undefined' },
      { src: "['nuevo', 'oferta']", t: 'string[]', el: ['string', 'string'] }, { src: '[40.4, -3.7]', t: 'number[]', el: ['number', 'number'] }, { src: "[1, 'a']", t: '(string | number)[]', el: ['number', 'string'] }
    ];
    let tipo = 3, val = 2, strict = true, tab = 0;
    const body = h('div'); card.appendChild(body);
    const tabs = tabsBar(card, ['Asignar valores', 'Inferencia'], i => { tab = i; pinta(); });
    card.insertBefore(tabs && card.lastChild, body);
    function asignable(T, v) {
      if (T === 'any') return null;
      const base = { 'string': ['string'], 'number': ['number'], 'boolean': ['boolean'], 'string | number': ['string', 'number'], 'number | null': ['number', 'null'] };
      if (!strict && (v.t === 'null' || v.t === 'undefined')) return null;
      if (base[T]) return base[T].includes(v.t) ? null : `Type '${v.t}' is not assignable to type '${T}'.`;
      if (T === 'string[]') {
        if (!v.el) return `Type '${v.t}' is not assignable to type 'string[]'.`;
        const bad = v.el.find(e => e !== 'string'); return bad ? `Type '${bad}' is not assignable to type 'string'.` : null;
      }
      if (T === '[number, number]') {
        if (!v.el) return `Type '${v.t}' is not assignable to type '[number, number]'.`;
        const bad = v.el.find(e => e !== 'number'); return bad ? `Type '${bad}' is not assignable to type 'number'.` : null;
      }
      return null;
    }
    const INF = [
      { c: "let nombre = 'Ana';", t: 'let nombre: string', d: 'Infiere <code>string</code> a partir del valor inicial. Escribir <code>: string</code> sería redundante.' },
      { c: "const pais = 'España';", t: 'const pais: "España"', d: 'Con <code>const</code> el valor ya no puede cambiar, así que el tipo es exactamente ese texto (un tipo literal).' },
      { c: 'let contador = 0;', t: 'let contador: number', d: 'No hay tipos separados para enteros y decimales: todo es <code>number</code>.' },
      { c: 'let activo = true;', t: 'let activo: boolean', d: 'Inferido del valor inicial.' },
      { c: "let etiquetas = ['nuevo', 'oferta'];", t: 'let etiquetas: string[]', d: 'Un array de textos se infiere como <code>string[]</code>.' },
      { c: 'let coordenadas = [40.4, -3.7];', t: 'let coordenadas: number[]', d: 'Ojo: infiere <code>number[]</code>, no la tupla <code>[number, number]</code>. Para una tupla hay que anotarla, como en la sesión.' },
      { c: "let mixto = [1, 'a'];", t: 'let mixto: (string | number)[]', d: 'Si el array mezcla tipos, infiere un array de la unión.' },
      { c: 'function saluda(nombre: string) {', t: 'function saluda(nombre: string): string', d: 'El parámetro necesita anotación (no hay valor del que deducir); el tipo de retorno sí se infiere del <code>return</code>.' },
      { c: '  return `Hola, ${nombre}`;', t: '(parameter) nombre: string', d: 'Dentro de la función, <code>nombre</code> ya es <code>string</code> gracias a la anotación.' },
      { c: '}', t: '', d: '' },
      { c: 'function doble(n) { return n * 2; }', t: '(parameter) n: any', d: 'Sin anotación, con <code>"strict": true</code> el compilador protesta:', err: { code: 'TS7006', msg: "Parameter 'n' implicitly has an 'any' type." } }
    ];
    let infSel = 0;
    function pinta() {
      body.innerHTML = '';
      if (tab === 0) {
        const c1 = row(body); const c2 = row(body);
        chips(c1, TIPOS.map(t => ({ label: t })), (it, i) => { tipo = i; pinta(); }, tipo, 'Tipo');
        chips(c2, VALS.map(v => ({ label: v.src })), (it, i) => { val = i; pinta(); }, val, 'Valor');
        const c3 = row(body); toggle(c3, '<code>"strict": true</code> en tsconfig.json', strict, v => { strict = v; pinta(); });
        const cc = cols(body);
        const p1 = pane(cc, 'Tu código', { dark: true, fn: 'dato.ts' });
        const T = TIPOS[tipo], V = VALS[val];
        const err = asignable(T, V);
        const cl = codeLines(p1.body, [['ts', `let dato: ${T} = ${V.src};`]]);
        if (err) cl.hl(0, 'hl-r');
        const out = h('div', { style: { padding: '0 12px 12px' } }); p1.body.appendChild(out);
        tscBox(out)(err ? [{ code: 'TS2322', msg: err, line: 1 }] : []);
        const p2 = pane(cc, 'Lo que llega al navegador', { dark: true, fn: 'dato.js' });
        codeLines(p2.body, [['ts', `let dato = ${V.src};`]]);
        p2.body.appendChild(h('p', { class: 'muted', style: { margin: '6px 12px 12px', fontSize: '14px', color: 'var(--code-muted)' }, html: 'Los tipos desaparecen al compilar: el navegador nunca ve una anotación de tipo.' }));
        const m = msgRow(body);
        if (T === 'any') m('<b>any</b> acepta cualquier cosa porque le dice a TypeScript «no compruebes nada». Es justo lo que la sesión llama una trampa.', 'warn');
        else if (!strict && (V.t === 'null' || V.t === 'undefined')) m('Sin <code>strict</code>, <code>null</code> y <code>undefined</code> se cuelan en cualquier tipo. Por eso Angular activa <code>strict</code> por defecto.', 'warn');
        else if (err) m('El error aparece en el editor <b>antes</b> de ejecutar nada. En JavaScript puro lo habrías descubierto cuando ya había roto algo.', 'bad');
        else m(T.includes('|') ? 'Válido: el valor encaja en uno de los tipos de la unión.' : 'Válido: el valor es del tipo declarado.', 'good');
      } else {
        const cc = cols(body);
        const p1 = pane(cc, 'Pasa el ratón o pulsa una línea', { dark: true, fn: 'inferencia.ts' });
        const cl = codeLines(p1.body, INF.map((x, i) => ['ts', x.c, 'l' + i]));
        $$('div', cl.el).forEach((d, i) => {
          if (!INF[i].t) return;
          d.style.cursor = 'pointer'; d.tabIndex = 0;
          const sel = () => { infSel = i; muestra(); };
          d.addEventListener('mouseenter', sel); d.addEventListener('click', sel); d.addEventListener('focus', sel);
        });
        const p2 = pane(cc, 'Lo que ve el editor');
        function muestra() {
          cl.clear(); cl.hl('l' + infSel, INF[infSel].err ? 'hl-r' : 'hl');
          const x = INF[infSel];
          p2.body.innerHTML = `<div class="code" style="box-shadow:none"><pre style="padding:10px 14px"><code>${HL.hl(x.t, 'ts')}</code></pre></div><p style="margin:10px 2px 0;color:var(--ink-2)">${x.d}</p>`;
          if (x.err) { const d = h('div', { style: { marginTop: '8px' } }); p2.body.appendChild(d); tscBox(d)([{ code: x.err.code, msg: x.err.msg }]); }
        }
        muestra();
      }
    }
    pinta();
  }
});

const EMAIL_RE = /^(?=.{1,254}$)(?=.{1,64}@)[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+)*@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$/;
const VALID = {
  required: v => (v == null || v === '') ? { required: true } : null,
  minlength: n => v => (v == null || v === '') ? null : (v.length < n ? { minlength: { requiredLength: n, actualLength: v.length } } : null),
  email: v => (v == null || v === '') ? null : (EMAIL_RE.test(v) ? null : { email: true }),
  soloLetras: v => { if (!v) return null; return /^[a-zA-ZÀ-ÿ\s]+$/.test(v) ? null : { soloLetras: true }; }
};
function errsDe(v, vals) { let e = null; vals.forEach(f => { const r = f(v); if (r) e = { ...(e || {}), ...r }; }); return e; }

lab('observable', {
  title: 'Promesa frente a Observable', block: '6', glyph: 'next · next · complete', col: '#A590FF',
  desc: 'Crea una promesa y un Observable y compara: cuándo empiezan a trabajar, cuántos valores entregan, qué pasa con un segundo suscriptor y cómo se cancela.',
  where: [{ s: '6.1', after: 'subscribe: el equivalente de .then' }], fichas: [{ f: 'observable-vs-promise', after: 'Observable: cero, uno o muchos valores en el tiempo' }],
  mount(host) {
    const card = simCard(host, { id: 'observable', title: 'Promesa frente a Observable', hint: 'Usa los botones de cada fila' });
    const EV = []; let t0 = performance.now(); const now = () => (performance.now() - t0) / 1000;
    const lanes = [{ k: 'p', label: 'Promise', col: COL.info }];
    let prom = null, subs = [];
    const term = terminal(card, { max: 10, placeholder: 'console.log' });
    const r1 = row(card), r2 = row(card);
    const g1 = grp(r1, 'Promesa');
    btn(g1, 'new Promise(…)', () => {
      if (prom) return;
      const p = prom = { t: now(), val: null, hs: [] };
      EV.push({ lane: 'p', t: now(), type: 'start' });
      term.log('Promise: el ejecutor se ejecuta YA, aunque nadie haya llamado a .then()', 'warn');
      p.hs.push(after(1500, () => { if (prom !== p) return; p.val = 'valor'; EV.push({ lane: 'p', t: now(), type: 'v', label: 'valor' }); EV.push({ lane: 'p', t: now() + .05, type: 'end' }); term.log('Promise: resolve(\'valor\') — fin, no habrá más valores', 'info'); }));
      m('La promesa empieza a trabajar en cuanto se crea (es «impaciente»). Ahora pulsa <code>.then()</code> una o varias veces.', 'info');
    }, 'ghost sm');
    btn(g1, '.then(v => …)', () => {

/* ---------- Errores: retry y catchError ---------- */
lab('errores', {

  desc: 'Decide cuántas veces falla el servidor, cuántos reintentos hay y en qué orden van retry y catchError. Mira qué llega al componente y cómo queda la interfaz.',

  mount(host) {
    const card = simCard(host, { id: 'errores', title: 'Fallos, reintentos y catchError', hint: 'Configura y pulsa «Cargar productos»' });

    seg(r1, [{ label: '500' }, { label: '404' }, { label: 'sin red (0)' }], (it, i) => { S.tipo = [500, 404, 0][i]; }, 0, 'Error');
    const r2 = row(card);
    rangeCtl(r2, { label: '<code>retry(n)</code>', min: 0, max: 3, value: S.retry, onInput: v => { S.retry = v; pintaCodigo(); } });
    seg(r2, [{ label: 'retry → catchError' }, { label: 'catchError → retry' }], (it, i) => { S.orden = i; pintaCodigo(); }, 0, 'Orden');
    toggle(r2, 'Con <code>catchError</code>', S.catchE, v => { S.catchE = v; pintaCodigo(); });
    const cc = cols(card, 'c3');
    const pC = pane(cc, 'Servicio', { dark: true, fn: 'productos-service.ts' }); const code = codeLines(pC.body, []);
    const pT = pane(cc, 'Intentos'); const tl = h('div', { class: 'stack', style: { gap: '6px' } }); pT.body.appendChild(tl);
    const pV = pane(cc, 'Componente (tres estados)'); const vista = h('div', { class: 'demo-ui' }); pV.body.appendChild(vista);
    const rb = row(card); const bGo = btn(rb, icon('play') + 'Cargar productos', () => corre(), '');
    const m = msgRow(card, 'Con la configuración por defecto: un fallo, dos reintentos.');
    function pintaCodigo() {
      const ops = [];
      const r = S.retry ? `    retry(${S.retry}),` : null, c = S.catchE ? '    catchError(() => of([]))' : null;
      if (S.orden === 0) { if (r) ops.push(['ts', r, 'retry']); if (c) ops.push(['ts', c, 'catch']); }
      else { if (c) ops.push(['ts', c + (r ? ',' : ''), 'catch']); if (r) ops.push(['ts', r.replace(/,$/, ''), 'retry']); }
      code.set([['ts', 'obtenerTodos(): Observable<Producto[]> {'], ['ts', '  return this.http.get<Producto[]>(this.url).pipe(', 'get'], ...ops, ['ts', '  );'], ['ts', '}']]);
    }
    let corriendo = false;
    async function corre() {
      if (corriendo) return; corriendo = true; bGo.disabled = true;
      tl.innerHTML = ''; estado('cargando');
      let intento = 0, recibido = null, error = null, fallosRestantes = S.fallos;
      const peticion = async () => {
        intento++;
        const d = h('div', { class: 'row', style: { gap: '8px', fontFamily: 'var(--f-mono)', fontSize: '12.5px', padding: '5px 8px', borderRadius: '8px', border: '1px solid var(--line)' }, html: `<span>#${intento} GET /products</span><span class="muted" style="margin-left:auto">…</span>` });
        tl.appendChild(d); code.hl('get', 'hl', 700);
        await sleep(REDUCED ? 0 : 650);
        if (fallosRestantes > 0) { fallosRestantes--; d.lastChild.outerHTML = `<span class="pill off" style="margin-left:auto">${S.tipo || 0} ${S.tipo === 500 ? 'Server Error' : S.tipo === 404 ? 'Not Found' : 'Unknown Error'}</span>`; return false; }
        d.lastChild.outerHTML = '<span class="pill on" style="margin-left:auto">200 OK</span>'; return true;
      };
      const nota = (t, c = 'muted') => tl.appendChild(h('div', { style: { fontSize: '13px', paddingLeft: '8px' }, class: c, html: t }));
      let ok = await peticion();
      if (!ok) {
        if (S.orden === 1 && S.catchE) { code.hl('catch', 'hl-y', 1400); nota('catchError atrapa el primer fallo y devuelve <code>of([])</code>: retry nunca ve el error'); recibido = []; }
        else {
          let quedan = S.retry;
          while (!ok && quedan > 0) { code.hl('retry', 'hl-y', 800); nota(`retry: reintento (${S.retry - quedan + 1} de ${S.retry})`); quedan--; ok = await peticion(); }
          if (!ok) {
            if (S.catchE) { code.hl('catch', 'hl-y', 1400); nota('catchError convierte el error en <code>of([])</code>'); recibido = []; }
            else { error = S.tipo; nota('Nadie captura el error: llega al subscribe', 'muted'); }
          }
        }
      }
      if (ok) recibido = [{ title: 'Zapatilla running' }, { title: 'Camiseta técnica' }, { title: 'Mochila trail' }];

      const n = intento;
      if (error !== null) m(`Tras ${n} ${n === 1 ? 'intento' : 'intentos'} el error llega hasta el componente: se ejecuta el callback <code>error</code> y <code>huboError = true</code>.`, 'bad');

      else m(`Tras ${n} ${n === 1 ? 'intento' : 'intentos'} fallidos, <code>catchError</code> devuelve un array vacío: el componente muestra la lista vacía sin saber que hubo un error.${S.tipo === 404 && S.retry ? ' Además, retry ha repetido un 404, que nunca se arregla reintentando.' : ''}`, 'warn');
      corriendo = false; bGo.disabled = false;
    }
    function estado(e, datos) {
      const dl = `<dl class="kv" style="margin-top:10px"><dt>cargando</dt><dd>${e === 'cargando'}</dd><dt>huboError</dt><dd>${e === 'error'}</dd><dt>productos</dt><dd>${datos ? datos.length + ' elementos' : '[]'}</dd></dl>`;
      if (e === 'cargando') vista.innerHTML = '<p style="margin:0">Cargando productos...</p>' + dl;
      else if (e === 'error') vista.innerHTML = '<p style="margin:0;color:var(--bad)">No se han podido cargar los productos. Inténtalo de nuevo más tarde.</p>' + dl;
      else vista.innerHTML = (datos.length ? datos.map(p => `<p style="margin:0">${esc(p.title)}</p>`).join('') : '<p class="muted" style="margin:0">(lista vacía)</p>') + dl;
      flash(vista, 'pulse-acc');
    }
    pintaCodigo(); estado('datos', []);
    vista.innerHTML = '<p class="muted" style="margin:0">Aún sin cargar.</p>';
  }
});

lab('switchmap', {

  mount(host, opt) {

      function pintaCode() { code.set([['ts', 'forkJoin({'], ['ts', '  productos: this.productosService.obtenerTodos(),', 'p'], ['ts', '  categorias: this.categoriasService.obtenerTodas()' + (F.infinito ? ',' : ''), 'c'], ...(F.infinito ? [['ts', '  reloj: interval(1000)', 'i']] : []), ['ts', '}).subscribe(resultado => {', 's'], ['ts', '  this.productos = resultado.productos;'], ['ts', '  this.categorias = resultado.categorias;'], ['ts', '});']]); }

    function pintaCodigo() {
      const body = S.modo === 0 ? [['ts', '    const clonada = req.clone({', 'mod'], ['ts', '      setHeaders: { Authorization: `Bearer ${token}` }', 'mod'], ['ts', '    });', 'mod'], ['ts', '    return next(clonada);']]
        : S.modo === 1 ? [['ts', '    req.headers.set(\'Authorization\', `Bearer ${token}`);', 'mod'], ['ts', '    return next(req);']]

      code.set([['ts', 'export const authInterceptor: HttpInterceptorFn = (req, next) => {'], ['ts', "  const token = localStorage.getItem('token');"], ['ts', '  if (token) {'], ...body, ['ts', '  }'], ['ts', '  return next(req);'], ['ts', '};']]);
      if (S.modo === 2) { code.hl('mod', 'hl-r'); tsc([{ code: 'TS2540', msg: "Cannot assign to 'headers' because it is a read-only property." }]); }
      else if (S.modo === 1) { code.hl('mod', 'hl-y'); tsc([], 'Compila… pero set() devuelve una copia nueva que nadie usa'); }
      else tsc([], 'Compila');

    }
    const nombres = () => S.orden === 0 ? ['authInterceptor', 'loggingInterceptor'] : ['loggingInterceptor', 'authInterceptor'];
    let boxes = {};
    function pintaEstaciones(activo, dir) {
      est.innerHTML = ''; boxes = {};
      const seq = ['Servicio', ...nombres(), 'Servidor'];
      seq.forEach((n, i) => {

});

function svgEl(tag, attrs) { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

lab('signals', {
  title: 'El grafo de las Signals', block: '7', glyph: 'signal() → computed()', col: '#FF6AA2',
  desc: 'Cambia signals y mira quién se entera: computed se recalcula solo cuando cambia una dependencia (y guarda el resultado), effect solo reacciona a las signals que lee. En la segunda pestaña, un servicio de estado con asReadonly().',
  where: [{ s: '7.1', after: 'effect(): reaccionar a cambios con un efecto secundario' }, { s: '7.2', after: 'Usándolo desde un componente', opt: { tab: 1 } }],

      toggle(r2, 'Comparar con un <code>get totalGetter()</code>', S.getter, v => { S.getter = v; pintaAll(); });
      const gW = h('div', { style: { padding: '14px 18px 0' } }); body.appendChild(gW);
      const cc = cols(body);
      const pC = pane(cc, 'Componente', { dark: true, fn: 'carrito.ts' });
      const code = codeLines(pC.body, [['ts', 'precioBase = signal(100);', 'precio'], ['ts', 'cantidad = signal(2);', 'cant'], ['ts', 'totalConIva = computed(() =>', 'comp'], ['ts', '  this.precioBase() * this.cantidad() * 1.21);', 'comp'], null, ['ts', 'constructor() {'], ['ts', '  effect(() => {', 'eff'], ['ts', "    console.log('La cantidad ha cambiado a:', this.cantidad());", 'eff'], ['ts', '  });', 'eff'], ['ts', '}']]);
      const pG = pane(gW, 'Quién depende de quién');
      const svg = svgEl('svg', { viewBox: '0 0 420 250', width: '100%', style: 'max-width:620px;display:block;margin:0 auto', role: 'img', 'aria-label': 'Grafo de dependencias' });
      pG.body.appendChild(svg);
      const N = { precio: [70, 40, 'precioBase', 'signal'], cant: [250, 40, 'cantidad', 'signal'], comp: [110, 135, 'totalConIva', 'computed'], eff: [330, 135, 'effect', 'effect'], tpl: [200, 220, 'plantilla', 'vista'] };
      const E = [['precio', 'comp'], ['cant', 'comp'], ['cant', 'eff'], ['comp', 'tpl'], ['cant', 'tpl']];
      const edges = {}, nodes = {};
      E.forEach(([a, b]) => { const [x1, y1] = N[a], [x2, y2] = N[b]; const p = svgEl('path', { d: `M${x1},${y1 + 16} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2 - 16}`, fill: 'none', stroke: 'var(--line)', 'stroke-width': 2 }); svg.appendChild(p); edges[a + b] = p; });

        const col = tipo === 'signal' ? 'var(--accent)' : tipo === 'computed' ? 'var(--hot)' : tipo === 'effect' ? 'var(--warn)' : 'var(--good)';

      term.log("La cantidad ha cambiado a: 2", 'warn');
      const rd = readout(body, [['computed recalculado', 'a'], ['lecturas de totalConIva()', 'b'], ['effect ejecutado', 'c'], ['getter recalculado', 'd']]);
      const m = msgRow(body, 'Cambia <code>precioBase</code> o <code>cantidad</code>.');
      const calc = () => Math.round(S.precio * S.cant * 1.21 * 100) / 100;
      function lee() { S.nLect++; if (S.sucio) { S.cache = calc(); S.sucio = false; S.nComp++; code.hl('comp', 'hl-p', 700); flashN('comp', 'var(--hot-soft)'); } if (S.getter) S.nGet++; }
      function set(k, v, diferido) {
        const antes = S[k]; S[k] = v;
        code.hl(k, 'hl', 700); flashN(k, 'var(--accent-soft)');
        if (Object.is(antes, v)) { m(`<code>${k === 'cant' ? 'cantidad' : 'precioBase'}.set(${v})</code> con el mismo valor que ya tenía: la Signal compara con <code>Object.is</code> y, como no ha cambiado, no avisa a nadie. Ni computed, ni effect, ni la plantilla hacen nada.`, 'info'); pintaAll(); return; }

/* ============================================================
   Navegación por hash (#inicio, #s-1.4, #f-ficha, #lab-id, ...)
   ============================================================ */
const NAV = { tab: null, userTab: null, abiertos: {}, filtro: '', kbIdx: -1 };
let VISTA = { v: 'inicio', id: null };

function ruta() {
  const hs = decodeURIComponent((location.hash || '').slice(1));
  if (!hs || hs === 'inicio') return { v: 'inicio' };
  if (hs.startsWith('s-')) return { v: 'sesion', id: hs.slice(2) };
  if (hs.startsWith('f-')) return { v: 'ficha', id: hs.slice(2) };
  if (hs.startsWith('lab-')) return { v: 'lab', id: hs.slice(4) };
  if (hs === 'laboratorio') return { v: 'labs' };
  if (hs === 'referencia') return { v: 'ref' };
  if (hs === 'verificador') return { v: 'verif' };
  if (hs === 'progreso') return { v: 'progreso' };
  return { v: 'inicio' };
}
function ir(hash) { if (location.hash === '#' + hash) render(); else location.hash = hash; }

function render() {
  limpiaVista();
  hidePop();
  VISTA = ruta();
  const v = VISTA;
  let html = '';
  if (v.v === 'sesion' && APP.porId[v.id]) html = vistaSesion(v.id);
  else if (v.v === 'ficha' && APP.refId[v.id]) html = vistaFicha(v.id);
  else if (v.v === 'lab' && LABS[v.id]) html = vistaLab(v.id);
  else if (v.v === 'labs') html = vistaLabs();
  else if (v.v === 'ref') html = vistaRef();
  else if (v.v === 'verif') html = vistaVerif();
  else if (v.v === 'progreso') html = vistaProgreso();
  else { VISTA = { v: 'inicio' }; html = vistaInicio(); }
  const view = $('#view');
  view.innerHTML = `<div class="view">${html}</div>`;
  montaLabs(view);
  postRender();
  window.scrollTo(0, 0);
  if (VISTA.v === 'sesion') ui.set('ultima', VISTA.id);
  if (VISTA.v === 'lab') { const vis = ui.get('labsVistos', []); if (!vis.includes(VISTA.id)) { vis.push(VISTA.id); ui.set('labsVistos', vis); } }
  pintaNav();
  cierraMenu();
  const t = tituloVista();
  $('#topTitle').textContent = t;
  document.title = t === 'Angular en acción' ? t : t + ' · Angular en acción';
}
function tituloVista() {

function snippet(texto, q) {
  const t = texto.replace(/```[\s\S]*?```/g, ' ').replace(/[#*`>|:[\]]/g, ' ').replace(/\s+/g, ' ');

}
function marca(txt, q) {
  const n = normaliza(txt), k = n.indexOf(q);

function buscaGlobal(qq) {

  ses.sort((a, b) => a.p - b.p);

  }
  con.sort((a, b) => a.p - b.p);
  const labs = Object.values(LABS).filter(L => normaliza(L.title + ' ' + (L.desc || '')).includes(q));
  return { ses: ses.slice(0, 12), con: con.slice(0, 12), labs: labs.slice(0, 6), q };
}
function resultadosBusqueda(qq) {

function datosExport() { return JSON.stringify({ app: 'angular-2dam', sello: APP.sello, estado: APP.estado }, null, 1); }
async function exporta() {

  if (dl) {

    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);

}

    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { }

}

/* ============================================================
   Después de pintar: índice lateral, barra de lectura, eventos
   ============================================================ */
let spyObs = null;
function postRender() {
  if (spyObs) { spyObs.disconnect(); spyObs = null; }
  const toc = $('.toc');
  if (toc) {
    const links = $$('a[data-salta]', toc);
    const targets = links.map(a => document.getElementById(a.dataset.salta)).filter(Boolean);
    const vis = new Map();
    spyObs = new IntersectionObserver(es => {
      es.forEach(e => vis.set(e.target.id, e.isIntersecting ? e.boundingClientRect.top : null));
      let best = null;
      for (const t of targets) { const r = t.getBoundingClientRect(); if (r.top < window.innerHeight * .35) best = t.id; }
      if (!best && targets[0]) best = targets[0].id;
      links.forEach(a => a.classList.toggle('on', a.dataset.salta === best));
    }, { rootMargin: '0px 0px -60% 0px' });
    targets.forEach(t => spyObs.observe(t));
  }
  const hero = $('[data-hero]');
  if (hero) heroTree(hero);
  const b = $('#busca');
  if (b) b.addEventListener('input', () => { filtroRef = b.value; $('#refList').innerHTML = listaRef(); });
  const n = $('#nombre');
  if (n) n.addEventListener('change', () => { APP.estado.alumno = n.value; guarda(); tosta('Guardado.'); });
  const se = $('#selEj');
  if (se) se.addEventListener('change', () => { VERIF.ej = se.value; VERIF.res = null; render(); });
  const th = $('#txHtml'), tc = $('#txCss'), tj = $('#txJs');
  if (th) th.addEventListener('input', () => { VERIF.html = th.value; });
  if (tc) tc.addEventListener('input', () => { VERIF.css = tc.value; });
  if (tj) tj.addEventListener('input', () => { VERIF.js = tj.value; });
  const z = $('#zona');
  if (z) {
    z.addEventListener('dragover', ev => { ev.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', () => z.classList.remove('over'));
    z.addEventListener('drop', async ev => {
      ev.preventDefault(); z.classList.remove('over');
      for (const f of ev.dataTransfer.files) {
        const t = await f.text();
        if (/\.s?css$/i.test(f.name)) VERIF.css = t; else if (/\.(m?js|ts)$/i.test(f.name)) VERIF.js = t; else VERIF.html = t;
      }
      render(); tosta('Archivo cargado.');
    });
  }
  lectura();
}
function lectura() {
